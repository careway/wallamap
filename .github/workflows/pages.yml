name: Deploy a GitHub Pages

# Publica app/public/ (la versión sin backend) en GitHub Pages.
#
# REQUISITO PREVIO (una sola vez): Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions". El token del workflow no puede crear el sitio de
# Pages por API en este repo ("Resource not accessible by integration"), así que
# hay que activarlo a mano antes del primer despliegue.

on:
  push:
    branches: [cliente-side]
    paths:
      - 'app/public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancela el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/public
      - id: deployment
        uses: actions/deploy-pages@v5
