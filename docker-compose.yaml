services:
  # Sólo sirve ficheros estáticos. El navegador habla con Wallapop directamente,
  # así que este contenedor no hace ninguna petición de salida.
  wallamap:
    image: nginx:alpine
    container_name: wallamap
    restart: always
    ports:
      - '127.0.0.1:3000:3000'   # acceso local directo; en prod se entra por el proxy
    volumes:
      - ./app/public:/usr/share/nginx/html:ro
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - red

  proxy_manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy_manager
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '192.168.31.111:81:81'
    volumes:
      - ./proxy/data:/data
      - ./proxy/letsencrypt:/etc/letsencrypt
    networks:
      - red

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: mi_duckdns
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - SUBDOMAINS=wallamap
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=true
    networks:
      - red

networks:
  red:
    driver: bridge
