# El nginx-proxy-manager reenvía a wallamap:3000, así que servimos ahí
# (y no en el 80 por defecto de la imagen).
server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
